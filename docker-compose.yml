services:
  data:
    build:
      context: retail-data-services
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
  cart:
    build:
      context: cart-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      data:
        condition: service_healthy
